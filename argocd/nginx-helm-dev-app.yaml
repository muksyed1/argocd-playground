apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-helm-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muksyed1/argocd-playground.git
    targetRevision: main
    path: charts/nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-dev
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true